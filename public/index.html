<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cafe Yoto Counter</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
:root{
  --bg:#F4F7FD;
  --surface:#FFFFFF;
  --surface-alt:#EEF3FC;
  --ink:#161B26;
  --ink-soft:#616B82;
  --ink-faint:#9AA4BD;
  --accent:#3B6FF0;
  --accent-dark:#2952C4;
  --accent-soft:#DCE6FE;
  --success:#22A06B;
  --success-soft:#DDF3E9;
  --warning:#E0940F;
  --warning-soft:#FCEBCF;
  --danger:#EF4D5E;
  --danger-soft:#FDE3E7;
  --border:#E4E9F5;
  --shadow:0 2px 10px rgba(22,27,38,0.06);
  --shadow-lg:0 16px 36px rgba(22,27,38,0.14);
  --radius:16px;
  --font:'Plus Jakarta Sans',-apple-system,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:var(--font);background:var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased;}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit;}
input,select{font-family:inherit;}
::selection{background:var(--accent-soft);}
#app{display:flex;min-height:100vh;}

.sidebar{width:216px;flex-shrink:0;background:var(--surface);border-right:1px solid var(--border);display:flex;flex-direction:column;padding:22px 14px;gap:4px;}
.brand{font-weight:800;font-size:1.28rem;color:var(--ink);padding:4px 10px 22px 10px;letter-spacing:-0.01em;display:flex;align-items:center;gap:10px;}
.brand .dot3{width:24px;height:24px;border-radius:8px;background:var(--accent);flex-shrink:0;}
.nav-item{display:flex;align-items:center;gap:12px;padding:11px 14px;border-radius:10px;font-size:0.92rem;font-weight:600;color:var(--ink-soft);transition:background 0.15s,color 0.15s;text-align:left;width:100%;position:relative;}
.nav-item svg{flex-shrink:0;}
.nav-item:hover{background:var(--surface-alt);color:var(--ink);}
.nav-item.active{background:var(--accent-soft);color:var(--accent-dark);}
.nav-dot{position:absolute;right:12px;width:7px;height:7px;border-radius:50%;background:var(--danger);}
.sidebar-foot{margin-top:auto;padding:10px;font-size:0.72rem;color:var(--ink-faint);}

.main-col{flex:1;display:flex;flex-direction:column;min-width:0;}
.topbar{height:64px;flex-shrink:0;background:var(--surface);border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;padding:0 26px;}
.topbar-left{display:flex;flex-direction:column;}
.topbar-title{font-weight:800;font-size:1.12rem;}
.topbar-sub{font-size:0.76rem;color:var(--ink-soft);}
.topbar-right{display:flex;align-items:center;gap:14px;}
.clock-live{font-size:0.85rem;color:var(--ink-soft);font-weight:600;}
.cashier-chip{display:flex;align-items:center;gap:8px;background:var(--surface-alt);padding:7px 12px;border-radius:999px;font-size:0.82rem;font-weight:600;}
.cashier-dot{width:8px;height:8px;border-radius:50%;background:var(--success);}
.viewonly-chip{display:flex;align-items:center;gap:8px;background:var(--danger-soft);color:var(--danger);padding:7px 12px;border-radius:999px;font-size:0.78rem;font-weight:700;}

.content{flex:1;overflow-y:auto;padding:26px;}
.view-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:20px;flex-wrap:wrap;gap:10px;}
.view-head h1{font-weight:800;font-size:1.4rem;}
.view-head p{color:var(--ink-soft);font-size:0.85rem;margin-top:2px;}

.btn{display:inline-flex;align-items:center;gap:7px;padding:9px 16px;border-radius:10px;font-size:0.85rem;font-weight:700;transition:transform 0.1s,background 0.15s;white-space:nowrap;}
.btn:active{transform:scale(0.97);}
.btn-accent{background:var(--accent);color:#fff;}
.btn-accent:hover{background:var(--accent-dark);}
.btn-outline{background:var(--surface);border:1.5px solid var(--border);color:var(--ink);}
.btn-outline:hover{border-color:var(--accent);color:var(--accent-dark);}
.btn-danger{background:var(--danger-soft);color:var(--danger);}
.btn-danger:hover{background:var(--danger);color:#fff;}
.btn-success{background:var(--success);color:#fff;}
.btn-sm{padding:6px 11px;font-size:0.76rem;}
.btn:disabled{opacity:0.45;cursor:not-allowed;}

.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow);}
.grid{display:grid;gap:16px;}

.ticket-badge{width:56px;height:56px;border-radius:16px;background:var(--accent-soft);display:flex;align-items:center;justify-content:center;flex-shrink:0;font-weight:800;font-size:1.15rem;color:var(--accent-dark);}
.ticket-badge.sm{width:40px;height:40px;font-size:0.85rem;border-radius:12px;}

.empty-state{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:60px 20px;color:var(--ink-faint);text-align:center;gap:10px;}
.empty-state svg{opacity:0.5;}
.empty-state h3{color:var(--ink-soft);font-weight:700;font-size:1.05rem;}

.badge{display:inline-flex;align-items:center;padding:3px 10px;border-radius:999px;font-size:0.7rem;font-weight:700;letter-spacing:0.02em;}
.badge-prep{background:var(--danger-soft);color:var(--danger);}
.badge-ready{background:var(--warning-soft);color:var(--warning);}
.badge-done{background:var(--success-soft);color:var(--success);}

.modal-overlay{position:fixed;inset:0;background:rgba(22,27,38,0.42);display:flex;align-items:center;justify-content:center;z-index:100;padding:20px;}
.modal{background:var(--surface);border-radius:18px;box-shadow:var(--shadow-lg);width:100%;max-width:460px;max-height:88vh;overflow-y:auto;}
.modal-head{display:flex;align-items:center;justify-content:space-between;padding:18px 20px;border-bottom:1px solid var(--border);}
.modal-head h2{font-size:1.08rem;font-weight:800;}
.modal-body{padding:20px;display:flex;flex-direction:column;gap:14px;}
.field{display:flex;flex-direction:column;gap:6px;}
.field label{font-size:0.78rem;font-weight:700;color:var(--ink-soft);}
.field input,.field select{padding:10px 12px;border:1.5px solid var(--border);border-radius:10px;font-size:0.9rem;background:var(--bg);color:var(--ink);}
.field input:focus,.field select:focus{outline:none;border-color:var(--accent);}
.field-row{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.modal-foot{padding:16px 20px;border-top:1px solid var(--border);display:flex;justify-content:flex-end;gap:10px;}
.recipe-row{display:grid;grid-template-columns:1fr 90px 30px;gap:8px;align-items:center;}
.size-row{display:grid;grid-template-columns:1fr 100px 30px;gap:8px;align-items:center;}
.cost-preview{background:var(--surface-alt);border-radius:10px;padding:10px 14px;font-size:0.82rem;display:flex;justify-content:space-between;}

@media(max-width:880px){
  #app{flex-direction:column;}
  .sidebar{width:100%;flex-direction:row;overflow-x:auto;padding:10px;border-right:none;border-bottom:1px solid var(--border);}
  .brand{display:none;}
  .nav-item{flex-direction:column;gap:4px;font-size:0.68rem;padding:8px 12px;white-space:nowrap;}
  .nav-dot{top:4px;right:8px;}
  .sidebar-foot{display:none;}
}

.lockgate{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:70px 20px;text-align:center;gap:14px;}
.lockgate .lock-ic{color:var(--ink-faint);}
.lockgate h2{font-size:1.25rem;font-weight:800;}
.lockgate p{color:var(--ink-soft);font-size:0.88rem;max-width:340px;}
.lockgate .actions{display:flex;gap:10px;margin-top:10px;}

.clockview-wrap{display:flex;justify-content:center;padding-top:20px;}
.clockcard{width:100%;max-width:420px;padding:34px 28px;text-align:center;}
.clockcard .big-time{font-size:2.1rem;font-weight:800;margin:6px 0 2px;}
.clockcard .big-date{color:var(--ink-soft);font-size:0.85rem;margin-bottom:22px;}
.emp-select{width:100%;margin-bottom:16px;}
.status-line{display:flex;align-items:center;justify-content:center;gap:8px;margin:14px 0 20px;font-size:0.88rem;color:var(--ink-soft);}
.emp-list{margin-top:26px;text-align:left;}
.emp-row{display:flex;align-items:center;justify-content:space-between;padding:9px 0;border-bottom:1px solid var(--border);font-size:0.85rem;}
.emp-row:last-child{border-bottom:none;}
.viewonly-link{margin-top:16px;font-size:0.8rem;color:var(--ink-soft);text-decoration:underline;}

.pos-layout{display:grid;grid-template-columns:1fr 360px;gap:20px;align-items:start;}
@media(max-width:1100px){.pos-layout{grid-template-columns:1fr;}}
.pos-toolbar{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;}
.edit-toggle{display:flex;align-items:center;gap:8px;padding:8px 14px;border-radius:999px;border:1.5px solid var(--border);font-size:0.8rem;font-weight:700;color:var(--ink-soft);background:var(--surface);}
.edit-toggle.on{background:var(--accent);border-color:var(--accent);color:#fff;}
.crumb{display:flex;align-items:center;gap:8px;font-size:0.85rem;font-weight:700;color:var(--ink-soft);margin-bottom:14px;}
.crumb button{color:var(--accent);font-weight:700;}

.catgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px;margin-bottom:20px;}
.catcard{background:var(--surface);border:1.5px solid var(--border);border-radius:18px;padding:16px;display:flex;flex-direction:column;gap:8px;text-align:left;transition:border-color 0.15s,transform 0.1s;position:relative;}
.catcard:hover{border-color:var(--accent);}
.catcard.active{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft);}
.catcard .cc-name{font-weight:800;font-size:1rem;}
.catcard .cc-count{font-size:0.76rem;color:var(--ink-soft);}
.catcard .cc-badge{align-self:flex-start;padding:3px 10px;border-radius:999px;font-size:0.66rem;font-weight:700;}
.cc-badge.avail{background:var(--success-soft);color:var(--success);}
.cc-badge.restock{background:var(--danger-soft);color:var(--danger);}
.catcard-ghost{border:1.5px dashed var(--border);border-radius:18px;padding:16px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;color:var(--ink-faint);font-weight:700;font-size:0.82rem;min-height:88px;}
.catcard-edit{position:absolute;top:10px;right:10px;display:flex;gap:4px;}
.catcard-edit button{width:22px;height:22px;border-radius:6px;background:var(--surface-alt);display:flex;align-items:center;justify-content:center;}

.prod-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px;}
.prod-card{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:14px;text-align:left;transition:border-color 0.15s,transform 0.1s;position:relative;}
.prod-card:hover{border-color:var(--accent);}
.prod-card:active{transform:scale(0.97);}
.prod-card .statusdot{position:absolute;top:12px;right:12px;width:11px;height:11px;border-radius:50%;box-shadow:0 0 0 3px var(--surface);}
.statusdot.ok{background:var(--success);}
.statusdot.low{background:var(--warning);}
.statusdot.soldout{background:var(--danger);}
.prod-card .pname{font-weight:700;font-size:0.88rem;margin-bottom:4px;padding-right:16px;}
.prod-card .pprice{color:var(--accent-dark);font-size:0.85rem;font-weight:700;}
.prod-card .psize{font-size:0.7rem;color:var(--ink-faint);margin-top:2px;}
.prod-card .pflag{font-size:0.68rem;color:var(--danger);margin-top:4px;font-weight:700;}
.prod-card.editmode{border-style:dashed;}
.prod-card-ghost{border:1.5px dashed var(--border);border-radius:16px;display:flex;align-items:center;justify-content:center;gap:6px;color:var(--ink-faint);font-weight:700;font-size:0.82rem;min-height:88px;}

.cart-panel{position:sticky;top:0;}
.cart-items{display:flex;flex-direction:column;gap:10px;max-height:220px;overflow-y:auto;padding:16px;}
.cart-row{display:flex;align-items:center;gap:8px;font-size:0.83rem;}
.cart-row .ciname{flex:1;font-weight:600;}
.cart-row .ciprice{color:var(--ink-soft);font-size:0.78rem;}
.qty-ctrl{display:flex;align-items:center;gap:6px;}
.qty-ctrl button{width:22px;height:22px;border-radius:7px;background:var(--surface-alt);display:flex;align-items:center;justify-content:center;font-weight:700;}
.cart-divider{border-top:1px dashed var(--border);}
.cart-summary{padding:14px 16px;display:flex;flex-direction:column;gap:6px;font-size:0.85rem;}
.sum-row{display:flex;justify-content:space-between;}
.sum-row.total{font-weight:800;font-size:1.05rem;padding-top:8px;border-top:1px solid var(--border);}
.disc-row{display:flex;gap:6px;padding:0 16px 10px;}
.disc-btn{flex:1;padding:8px;border-radius:9px;border:1.5px solid var(--border);font-size:0.75rem;font-weight:700;color:var(--ink-soft);}
.disc-btn.active{background:var(--accent-soft);border-color:var(--accent);color:var(--accent-dark);}
.pay-row{display:flex;gap:6px;padding:0 16px 12px;}
.pay-btn{flex:1;padding:9px;border-radius:9px;border:1.5px solid var(--border);font-size:0.75rem;font-weight:700;}
.pay-btn.active{background:var(--ink);color:#fff;border-color:var(--ink);}
.mini-inputs{padding:0 16px 10px;display:flex;flex-direction:column;gap:8px;}
.mini-inputs input{padding:8px 10px;border:1.5px solid var(--border);border-radius:9px;font-size:0.82rem;background:var(--bg);}
.tender-row{display:flex;gap:6px;padding:0 16px 8px;flex-wrap:wrap;}
.tender-btn{flex:1;min-width:70px;padding:9px 6px;border-radius:9px;border:1.5px solid var(--border);font-size:0.78rem;font-weight:700;text-align:center;}
.tender-btn.active{background:var(--accent);color:#fff;border-color:var(--accent);}
.size-pick{display:flex;flex-direction:column;gap:8px;}
.size-pick button{display:flex;justify-content:space-between;padding:12px 14px;border:1.5px solid var(--border);border-radius:12px;font-weight:700;font-size:0.88rem;}
.size-pick button:hover{border-color:var(--accent);}

.orders-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:14px;}
.order-card{padding:16px;display:flex;flex-direction:column;gap:10px;}
.order-card-head{display:flex;align-items:center;gap:12px;}
.order-card-head .meta{flex:1;}
.order-card-head .meta .t{font-size:0.7rem;color:var(--ink-faint);}
.order-items-mini{font-size:0.78rem;color:var(--ink-soft);line-height:1.5;}
.order-actions{display:flex;gap:8px;margin-top:auto;}

.report-tabs{display:flex;gap:8px;margin-bottom:18px;flex-wrap:wrap;}
.date-filter-bar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:16px;}
.date-preset{padding:7px 13px;border-radius:9px;border:1.5px solid var(--border);font-size:0.78rem;font-weight:700;color:var(--ink-soft);background:var(--surface);}
.date-preset.active{background:var(--ink);color:#fff;border-color:var(--ink);}
.date-inputs{display:flex;align-items:center;gap:6px;}
.date-inputs input{padding:7px 10px;border:1.5px solid var(--border);border-radius:9px;font-size:0.8rem;background:var(--surface);}
.stat-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:14px;margin-bottom:20px;}
.stat-card{padding:16px;}
.stat-card .label{font-size:0.72rem;color:var(--ink-soft);font-weight:700;text-transform:uppercase;letter-spacing:0.03em;}
.stat-card .val{font-size:1.5rem;font-weight:800;margin-top:4px;}
table{width:100%;border-collapse:collapse;font-size:0.85rem;}
th{text-align:left;padding:12px 16px;color:var(--ink-soft);font-size:0.72rem;text-transform:uppercase;letter-spacing:0.03em;border-bottom:1px solid var(--border);}
td{padding:13px 16px;border-bottom:1px solid var(--border);}
tr:last-child td{border-bottom:none;}
tr.row-soldout td:first-child{border-left:3px solid var(--danger);}
tr.row-low td:first-child{border-left:3px solid var(--warning);}
.top-flag{background:var(--accent-soft);color:var(--accent-dark);padding:2px 8px;border-radius:6px;font-size:0.68rem;font-weight:800;margin-left:8px;}

.inv-subtabs{display:flex;gap:8px;margin-bottom:16px;align-items:center;}
.warncount{background:var(--danger);color:#fff;border-radius:999px;padding:1px 7px;font-size:0.68rem;margin-left:6px;}
.statuspill{display:inline-flex;padding:3px 11px;border-radius:999px;font-size:0.72rem;font-weight:700;}
.statuspill.ok{background:var(--success-soft);color:var(--success);}
.statuspill.low{background:var(--warning-soft);color:var(--warning);}
.statuspill.soldout{background:var(--danger-soft);color:var(--danger);}
.low-banner{display:flex;align-items:center;gap:10px;background:var(--danger-soft);color:var(--danger);padding:12px 16px;border-radius:12px;font-size:0.84rem;font-weight:700;margin-bottom:16px;}

.prod-inv-row{display:flex;align-items:center;gap:12px;padding:14px 16px;flex-wrap:wrap;}
.margin-pill{font-size:0.7rem;font-weight:800;padding:3px 9px;border-radius:999px;background:var(--success-soft);color:var(--success);}
.margin-pill.neg{background:var(--danger-soft);color:var(--danger);}
.size-chip{background:var(--surface-alt);padding:3px 10px;border-radius:999px;font-size:0.72rem;font-weight:700;color:var(--ink-soft);}

.receipt-view{font-size:0.8rem;background:var(--surface);padding:22px;border-radius:14px;border:1px dashed var(--border);width:280px;line-height:1.7;}
.receipt-view .rc-center{text-align:center;}
.receipt-view .rc-line{border-top:1px dashed var(--ink-faint);margin:8px 0;}
.receipt-view .rc-row{display:flex;justify-content:space-between;}

#print-area{display:none;}
@media print{
  body *{visibility:hidden;}
  #print-area,#print-area *{visibility:visible;}
  #print-area{display:block;position:absolute;top:0;left:0;width:280px;}
}

.exp-form{display:grid;grid-template-columns:1.4fr 1fr 1fr auto;gap:10px;align-items:end;margin-bottom:20px;}
.exp-form .field input{padding:10px 12px;}

.toast{position:fixed;bottom:24px;right:24px;background:var(--ink);color:#fff;padding:13px 20px;border-radius:12px;font-size:0.85rem;font-weight:600;box-shadow:var(--shadow-lg);z-index:200;display:flex;align-items:center;gap:10px;animation:toastin 0.2s ease-out;max-width:320px;}
@keyframes toastin{from{opacity:0;transform:translateY(8px);}to{opacity:1;transform:translateY(0);}}
.loading-wrap{display:flex;align-items:center;justify-content:center;height:100vh;width:100%;color:var(--ink-soft);font-weight:700;}
</style>
</head>
<body>
<div id="app"><div class="loading-wrap">Loading your counter…</div></div>
<div id="print-area"></div>
<script>
const BACKEND_URL='https://cafe-yoto-backend.onrender.com';
window.storage={
  async get(key){
    const res=await fetch(`${BACKEND_URL}/api/state/${encodeURIComponent(key)}`);
    if(res.status===404)return null;
    if(!res.ok)throw new Error('Backend not reachable at '+BACKEND_URL);
    return await res.json();
  },
  async set(key,value){
    const res=await fetch(`${BACKEND_URL}/api/state/${encodeURIComponent(key)}`,{
      method:'PUT',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({value})
    });
    if(!res.ok)throw new Error('Backend not reachable at '+BACKEND_URL);
    return await res.json();
  }
};
const ICONS={
  clock:'<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 3"/></svg>',
  pos:'<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 8l1.5-3h13L20 8"/><path d="M4 8h16v10a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2z"/><path d="M9 12h6"/></svg>',
  orders:'<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="3" width="14" height="18" rx="2"/><path d="M9 8h6M9 12h6M9 16h3"/></svg>',
  inventory:'<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 8l-9-5-9 5 9 5 9-5z"/><path d="M3 8v8l9 5 9-5V8"/><path d="M12 13v8"/></svg>',

function migrateProduct(p){
  if(!p.sizes||!p.sizes.length){
    p.sizes=[{id:uid(),label:'Regular',price:p.price||0}];
  }
  if(!p.recipe)p.recipe=[];
  return p;
}

async function loadData(){
  try{
    const core=await window.storage.get('yoto-core');
    if(core&&core.value){
      const parsed=JSON.parse(core.value);
      state.employees=parsed.employees||[];
      state.shifts=parsed.shifts||[];
      state.products=(parsed.products&&parsed.products.length?parsed.products:defaultProducts()).map(migrateProduct);
      state.ingredients=parsed.ingredients&&parsed.ingredients.length?parsed.ingredients:defaultIngredients();
      state.expenses=parsed.expenses||[];
      state.settings=parsed.settings||state.settings;
      state.categories=parsed.categories||state.categories;
      if(!parsed.products||!parsed.products.length||!parsed.ingredients||!parsed.ingredients.length){await saveCore();}
    }else{
      state.products=defaultProducts();
      state.ingredients=defaultIngredients();
      await saveCore();
    }
  }catch(e){state.products=defaultProducts();state.ingredients=defaultIngredients();ui.backendDown=true;}
  try{
    const orders=await window.storage.get('yoto-orders');
    if(orders&&orders.value){state.orders=JSON.parse(orders.value).orders||[];}
  }catch(e){ui.backendDown=true;}
  if(!ui.posCategory&&state.categories.length)ui.posCategory=state.categories[0];
}

function toast(msg){
  const t=document.createElement('div');
  t.className='toast';
  t.innerHTML=msg;
  document.body.appendChild(t);
  setTimeout(()=>t.remove(),3200);
}

function nextOrderNumber(){
  const today=todayStr();
  if(state.settings.lastOrderDate!==today){state.settings.orderCounter=0;state.settings.lastOrderDate=today;}
  state.settings.orderCounter+=1;
  if(state.settings.orderCounter>99)state.settings.orderCounter=1;
  return String(state.settings.orderCounter);
}

function fmtTime(iso){return new Date(iso).toLocaleTimeString('en-PH',{hour:'2-digit',minute:'2-digit'});}
function fmtDate(iso){return new Date(iso).toLocaleDateString('en-PH',{month:'short',day:'numeric',year:'numeric'});}
function fmtDur(ms){const h=Math.floor(ms/3600000),m=Math.floor((ms%3600000)/60000);return h+'h '+m+'m';}

function currentEmployee(){return state.employees.find(e=>e.id===ui.activeEmployeeId);}
function activeShiftFor(empId){return state.shifts.find(s=>s.employeeId===empId&&!s.timeOut);}
function currentMode(){
  if(ui.activeEmployeeId&&activeShiftFor(ui.activeEmployeeId))return 'active';
  if(ui.viewOnly)return 'viewonly';
  return 'locked';
}
function canManage(){return currentMode()==='active';}

function ingredientById(id){return state.ingredients.find(i=>i.id===id);}
function unitCostOf(ing){return (ing.purchasePrice+ing.shippingCost)/ing.purchaseQtyInBase;}
function productCost(p){return (p.recipe||[]).reduce((s,r)=>{const ing=ingredientById(r.ingredientId);return s+(ing?unitCostOf(ing)*r.qty:0);},0);}
function isLowStock(ing){return ing.stockInBase<=ing.lowStockPurchaseUnits*ing.purchaseQtyInBase;}
function lowStockIngredients(){return state.ingredients.filter(isLowStock);}

function productStatus(p){
  if(!p.recipe||!p.recipe.length)return 'ok';
  let worst='ok';
  for(const r of p.recipe){
    const ing=ingredientById(r.ingredientId);
    if(!ing)continue;
    if(ing.stockInBase<=0||ing.stockInBase<r.qty)return 'soldout';
    if(isLowStock(ing))worst='low';
  }
  return worst;
}
function productAvailable(p){return productStatus(p)!=='soldout';}

  if(!ui.activeEmployeeId)return;
  state.shifts.push({id:uid(),employeeId:ui.activeEmployeeId,timeIn:new Date().toISOString(),timeOut:null});

  saveCore();
  render();
  toast('Timed in. Have a good shift!');
}
function timeOut(){
  const s=activeShiftFor(ui.activeEmployeeId);
  if(!s)return;
  s.timeOut=new Date().toISOString();
  const dur=fmtDur(new Date(s.timeOut)-new Date(s.timeIn));
  saveCore();
  render();
  toast(`Shift ended. Worked ${dur}. System is now locked.`);
}

function selectCategory(c){ui.posCategory=c;renderView();}

function buildTenderOptions(total){
  if(total<=0)return [];
  const exact=Math.round(total*100)/100;
  const denoms=[20,50,100,200,500,1000];
  const ups=denoms.filter(d=>d>=exact).sort((a,b)=>a-b);
  const opts=[exact];
  for(const d of ups){if(opts.length>=4)break;if(!opts.includes(d))opts.push(d);}
  return opts.slice(0,4);
}

function computeCartTotals(){
  const subtotal=ui.cart.reduce((s,c)=>s+c.price*c.qty,0);
  if(ui.discountType!=='none'){
    const vatExempt=subtotal/1.12;
    const discount=vatExempt*state.settings.discountRate;
    return {subtotal,discount,vat:0,total:vatExempt-discount};
  }else{
    const vatableSales=subtotal/1.12;
    const vat=subtotal-vatableSales;
    return {subtotal,discount:0,vat,total:subtotal};
  }
}

function addToCart(productId){
  if(!canManage())return;
  const p=state.products.find(x=>x.id===productId);
  if(!p||!productAvailable(p))return;
  if(p.sizes.length>1){ui.showSizePicker=productId;renderView();return;}
  pushCartItem(p,p.sizes[0]);
  renderView();
}
function pushCartItem(p,size){
  const existing=ui.cart.find(c=>c.productId===p.id&&c.sizeId===size.id);
  if(existing)existing.qty+=1;
  else ui.cart.push({productId:p.id,sizeId:size.id,name:p.name+(p.sizes.length>1?' ('+size.label+')':''),price:size.price,qty:1});
  ui.tendered='';
}
function pickSize(productId,sizeId){
  const p=state.products.find(x=>x.id===productId);
  const size=p.sizes.find(s=>s.id===sizeId);
  if(!p||!size)return;
  pushCartItem(p,size);
  ui.showSizePicker=null;
  closeModal('size-modal');
  renderView();
}
function changeQty(productId,sizeId,delta){
  const ci=ui.cart.find(c=>c.productId===productId&&c.sizeId===sizeId);
  if(!ci)return;
  ci.qty+=delta;
  if(ci.qty<=0)ui.cart=ui.cart.filter(c=>!(c.productId===productId&&c.sizeId===sizeId));
  ui.tendered='';
  renderView();
}
function clearCart(){ui.cart=[];ui.discountType='none';ui.discName='';ui.discId='';ui.tendered='';ui.payRef='';renderView();}
function setDiscount(t){ui.discountType=t;renderView();}

function completeSale(){
  if(!canManage()||!ui.cart.length)return;
  const totals=computeCartTotals();
  if(ui.discountType!=='none'&&(!ui.discName.trim()||!ui.discId.trim())){toast('Enter the ID holder name and number for the discount');return;}
  if(ui.payMethod==='Cash'&&(parseFloat(ui.tendered)||0)<totals.total){toast('Amount tendered is less than the total');return;}
  ui.cart.forEach(ci=>{
    const p=state.products.find(x=>x.id===ci.productId);
    if(p&&p.recipe){
      p.recipe.forEach(r=>{
        const ing=ingredientById(r.ingredientId);
        if(ing)ing.stockInBase=Math.max(0,ing.stockInBase-r.qty*ci.qty);
      });
    }
  });
  const order={
    id:uid(),number:nextOrderNumber(),
    items:ui.cart.map(c=>{
      const p=state.products.find(x=>x.id===c.productId);
      return {name:c.name,price:c.price,qty:c.qty,category:p?p.category:'',costEach:p?productCost(p):0};
    }),
    employeeId:ui.activeEmployeeId,employeeName:currentEmployee().name,
    discountType:ui.discountType,discName:ui.discName,discId:ui.discId,
    paymentMethod:ui.payMethod,payRef:ui.payRef,
    tendered:ui.payMethod==='Cash'?parseFloat(ui.tendered)||0:null,
    subtotal:totals.subtotal,discount:totals.discount,vat:totals.vat,total:totals.total,
    status:'preparing',timestamp:new Date().toISOString()
  };
  state.orders.push(order);
  saveCore();saveOrders();
  const oid=order.id;
  clearCart();
  renderView();
  toast(`Order #${order.number} sent to queue`);
  openReceipt(oid);
}

function adjustIngredientStock(id,delta){
  if(!canManage())return;
  const ing=ingredientById(id);
  if(!ing)return;
  ing.stockInBase=Math.max(0,ing.stockInBase+delta);
  saveCore();renderView();
}
function restockIngredient(id){
  if(!canManage())return;
  const ing=ingredientById(id);
  if(!ing)return;
  ing.stockInBase+=ing.purchaseQtyInBase;
  saveCore();renderView();
  toast(`Restocked ${ing.name} by 1 ${ing.purchaseLabel}`);
}
function deleteIngredient(id){
  if(!canManage())return;
  state.ingredients=state.ingredients.filter(i=>i.id!==id);
  state.products.forEach(p=>{p.recipe=(p.recipe||[]).filter(r=>r.ingredientId!==id);});
  saveCore();renderView();
}
function deleteProduct(id){
  if(!canManage())return;
  state.products=state.products.filter(p=>p.id!==id);
  saveCore();renderView();
}

function addCategory(){
  if(!canManage())return;
  const name=prompt('New category name');
  if(name&&name.trim()&&!state.categories.includes(name.trim())){
    state.categories.push(name.trim());
    ui.posCategory=name.trim();
    saveCore();renderView();
  }
}
function renameCategory(oldName){
  if(!canManage())return;
  const name=prompt('Rename category',oldName);
  if(name&&name.trim()){
    state.categories=state.categories.map(c=>c===oldName?name.trim():c);
    state.products.forEach(p=>{if(p.category===oldName)p.category=name.trim();});
    if(ui.posCategory===oldName)ui.posCategory=name.trim();
    saveCore();renderView();
  }
}
function deleteCategory(name){
  if(!canManage())return;
  if(state.products.some(p=>p.category===name)){toast('Move or delete items in this category first');return;}
  if(confirm('Delete category "'+name+'"?')){
    state.categories=state.categories.filter(c=>c!==name);
    if(ui.posCategory===name)ui.posCategory=state.categories[0]||null;
    saveCore();renderView();
  }
}

function dateRange(preset,startStr,endStr){
  const now=new Date();
  const startOfToday=new Date(now.getFullYear(),now.getMonth(),now.getDate(),0,0,0);
  const endOfToday=new Date(now.getFullYear(),now.getMonth(),now.getDate(),23,59,59);
  if(preset==='today')return {start:startOfToday,end:endOfToday};
  if(preset==='week'){const s=new Date(startOfToday);s.setDate(s.getDate()-6);return {start:s,end:endOfToday};}
  if(preset==='month'){const s=new Date(startOfToday);s.setDate(s.getDate()-29);return {start:s,end:endOfToday};}
  if(preset==='all')return {start:new Date(2000,0,1),end:endOfToday};
  if(preset==='custom'&&startStr&&endStr)return {start:new Date(startStr+'T00:00:00'),end:new Date(endStr+'T23:59:59')};
  return {start:startOfToday,end:endOfToday};
}

function renderReports(){

  const cogs=orders.reduce((s,o)=>s+o.items.reduce((ss,i)=>ss+(i.costEach||0)*i.qty,0),0);

  const avg=orders.length?netSales/orders.length:0;

  const itemMap={};
  orders.forEach(o=>o.items.forEach(i=>{itemMap[i.name]=itemMap[i.name]||{qty:0,revenue:0};itemMap[i.name].qty+=i.qty;itemMap[i.name].revenue+=i.qty*i.price;}));

  const empMap={};

    </div>`;
  }else if(ui.reportTab==='item'){
    body=`<div class="card"><table><thead><tr><th>Item</th><th>Qty Sold</th><th>Revenue</th></tr></thead><tbody>
      ${itemRows.map(([name,d],idx)=>`<tr><td>${name}${idx===0?'<span class="top-flag">TOP SELLER</span>':''}</td><td>${d.qty}</td><td>${peso(d.revenue)}</td></tr>`).join('')||'<tr><td colspan="3" style="color:var(--ink-faint);">No sales in this range.</td></tr>'}

  }else if(ui.reportTab==='category'){
    body=`<div class="card"><table><thead><tr><th>Category</th><th>Qty Sold</th><th>Revenue</th></tr></thead><tbody>
      ${Object.entries(catMap).sort((a,b)=>b[1].revenue-a[1].revenue).map(([name,d])=>`<tr><td>${name}</td><td>${d.qty}</td><td>${peso(d.revenue)}</td></tr>`).join('')||'<tr><td colspan="3" style="color:var(--ink-faint);">No sales in this range.</td></tr>'}

    ${ui.reportPreset==='custom'?`

function exportSummary(){
  const range=dateRange(ui.reportPreset,ui.reportStart,ui.reportEnd);
  const orders=state.orders.filter(o=>{if(o.status==='cancelled')return false;const d=new Date(o.timestamp);return d>=range.start&&d<=range.end;});
  const grossSales=orders.reduce((s,o)=>s+o.subtotal,0);
  const discounts=orders.reduce((s,o)=>s+o.discount,0);
  const netSales=orders.reduce((s,o)=>s+o.total,0);
  const cogs=orders.reduce((s,o)=>s+o.items.reduce((ss,i)=>ss+(i.costEach||0)*i.qty,0),0);
  const grossProfit=netSales-cogs;
  const itemMap={};
  orders.forEach(o=>o.items.forEach(i=>{itemMap[i.name]=itemMap[i.name]||{qty:0,revenue:0};itemMap[i.name].qty+=i.qty;itemMap[i.name].revenue+=i.qty*i.price;}));

  const summarySheet=[
    ['Cafe Yoto Sales Summary'],
    ['Range',ui.reportStart&&ui.reportEnd?ui.reportStart+' to '+ui.reportEnd:ui.reportPreset],
    [],
    ['Metric','Amount'],
    ['Gross Sales',grossSales.toFixed(2)],
    ['Discounts',discounts.toFixed(2)],
    ['Net Sales',netSales.toFixed(2)],
    ['Gross Profit',grossProfit.toFixed(2)],
    ['Orders',orders.length],
  ];
  const itemSheet=[['Item','Qty Sold','Revenue'],...Object.entries(itemMap).sort((a,b)=>b[1].qty-a[1].qty).map(([n,d])=>[n,d.qty,d.revenue.toFixed(2)])];

  const wb=XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb,XLSX.utils.aoa_to_sheet(summarySheet),'Summary');
  XLSX.utils.book_append_sheet(wb,XLSX.utils.aoa_to_sheet(itemSheet),'By Item');
  XLSX.writeFile(wb,`CafeYoto-SalesSummary-${todayStr()}.xlsx`);
}

async function connectBluetoothPrinter(orderId){
  const o=state.orders.find(x=>x.id===orderId);
  if(!navigator.bluetooth){toast('Web Bluetooth is not supported on this browser. Use Chrome on Android or Desktop, or try Print via Browser.');return;}
  try{
    const device=await navigator.bluetooth.requestDevice({acceptAllDevices:true,optionalServices:['000018f0-0000-1000-8000-00805f9b34fb','49535343-fe7d-4ae5-8fa9-9fafd205e455','e7810a71-73ae-499d-8c15-faa9aef0c3f2']});
    const server=await device.gatt.connect();
    let sent=false;
    for(const svc of ['000018f0-0000-1000-8000-00805f9b34fb','49535343-fe7d-4ae5-8fa9-9fafd205e455']){
      try{
        const service=await server.getPrimaryService(svc);
        const chars=await service.getCharacteristics();
        const writable=chars.find(c=>c.properties.write||c.properties.writeWithoutResponse);
        if(writable){
          const text=receiptToPlainText(o)+"\n\n\n";
          await writable.writeValue(new TextEncoder().encode(text));
          sent=true;break;
        }
      }catch(e){}
    }
    toast(sent?'Sent to printer via Bluetooth.':'Connected, but no compatible print service found. Try Print via Browser instead.');
  }catch(e){toast('Bluetooth printing did not connect. Use Print via Browser for a reliable receipt.');}
}
function receiptToPlainText(o){
  let lines=['CAFE YOTO','Dasmarinas City, Cavite','--------------------------------',`Order #${o.number}  ${fmtTime(o.timestamp)}`,`Cashier: ${o.employeeName}`,'--------------------------------'];
  o.items.forEach(i=>lines.push(`${i.qty}x ${i.name}  ${peso(i.qty*i.price)}`));
  lines.push('--------------------------------');
  lines.push(`Subtotal: ${peso(o.subtotal)}`);
  if(o.discount>0)lines.push(`Discount: -${peso(o.discount)}`);
  lines.push(`VAT: ${peso(o.vat)}`);
  lines.push(`TOTAL: ${peso(o.total)}`);
  lines.push(`Payment: ${o.paymentMethod}`);
  lines.push('Thank you, come again!');
  return lines.join('\n');
}
