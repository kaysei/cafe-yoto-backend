<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Cafe Yoto">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#3B6FF0">
<link rel="manifest" href="/manifest.json">
<link rel="apple-touch-icon" href="/icon-192.png">
<title>Cafe Yoto</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
:root{
--bg:#F4F7FD;--surf:#fff;--surf2:#EEF3FC;--ink:#161B26;--ink2:#616B82;--ink3:#9AA4BD;
--blue:#3B6FF0;--blue2:#2952C4;--bluesoft:#DCE6FE;
--green:#22A06B;--greensoft:#DDF3E9;
--yellow:#E0940F;--yellowsoft:#FCEBCF;
--red:#EF4D5E;--redsoft:#FDE3E7;
--border:#E4E9F5;--sh:0 2px 10px rgba(22,27,38,.06);--shlg:0 16px 36px rgba(22,27,38,.14);
--r:14px;--font:'Plus Jakarta Sans',sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:var(--font);background:var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased;overflow:hidden;height:100vh;}
button{font-family:var(--font);cursor:pointer;border:none;background:none;color:inherit;}
input,select,textarea{font-family:var(--font);}
#app{display:flex;height:100vh;}

/* SIDEBAR */
.sb{width:60px;flex-shrink:0;background:var(--surf);border-right:1px solid var(--border);display:flex;flex-direction:column;align-items:center;padding:14px 0;gap:2px;}
.sb-logo{width:34px;height:34px;border-radius:10px;background:var(--blue);margin-bottom:14px;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:800;font-size:0.8rem;}
.ni{width:42px;height:42px;border-radius:11px;display:flex;align-items:center;justify-content:center;color:var(--ink3);transition:all .15s;position:relative;cursor:pointer;}
.ni:hover{background:var(--surf2);color:var(--ink);}
.ni.act{background:var(--bluesoft);color:var(--blue);}
.ni .tip{position:absolute;left:50px;background:var(--ink);color:#fff;padding:4px 9px;border-radius:7px;font-size:.72rem;font-weight:600;white-space:nowrap;opacity:0;pointer-events:none;transition:opacity .15s;z-index:99;}
.ni:hover .tip{opacity:1;}
.ni .dot{position:absolute;top:7px;right:7px;width:7px;height:7px;border-radius:50%;background:var(--red);}
.sb-foot{margin-top:auto;}

/* MAIN */
.main{flex:1;display:flex;flex-direction:column;overflow:hidden;}
.topbar{height:54px;flex-shrink:0;background:var(--surf);border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;padding:0 18px;gap:10px;}
.tb-title{font-weight:800;font-size:.98rem;}
.tb-right{display:flex;align-items:center;gap:10px;}
.chip{display:flex;align-items:center;gap:6px;background:var(--surf2);padding:5px 10px;border-radius:999px;font-size:.76rem;font-weight:600;}
.chip-dot{width:7px;height:7px;border-radius:50%;background:var(--green);}
.vo-chip{background:var(--yellowsoft);color:var(--yellow);padding:5px 10px;border-radius:999px;font-size:.73rem;font-weight:700;}
.backend-warn{background:var(--redsoft);color:var(--red);padding:7px 18px;font-size:.76rem;font-weight:700;flex-shrink:0;}
.content{flex:1;overflow-y:auto;padding:18px;}

/* BUTTONS */
.btn{display:inline-flex;align-items:center;gap:5px;padding:7px 13px;border-radius:9px;font-size:.8rem;font-weight:700;transition:transform .1s,background .15s;white-space:nowrap;}
.btn:active{transform:scale(.97);}
.btn-blue{background:var(--blue);color:#fff;}.btn-blue:hover{background:var(--blue2);}
.btn-out{background:var(--surf);border:1.5px solid var(--border);color:var(--ink);}.btn-out:hover{border-color:var(--blue);color:var(--blue2);}
.btn-red{background:var(--redsoft);color:var(--red);}.btn-red:hover{background:var(--red);color:#fff;}
.btn-grn{background:var(--green);color:#fff;}
.btn-sm{padding:5px 9px;font-size:.72rem;}
.btn-xs{padding:3px 7px;font-size:.67rem;}
.btn:disabled{opacity:.4;cursor:not-allowed;}
.card{background:var(--surf);border:1px solid var(--border);border-radius:var(--r);box-shadow:var(--sh);}

/* TABLE */
table{width:100%;border-collapse:collapse;font-size:.82rem;}
th{text-align:left;padding:9px 13px;color:var(--ink2);font-size:.68rem;text-transform:uppercase;letter-spacing:.03em;border-bottom:1px solid var(--border);}
td{padding:10px 13px;border-bottom:1px solid var(--border);vertical-align:middle;}
tr:last-child td{border-bottom:none;}
.pill{display:inline-flex;padding:2px 9px;border-radius:999px;font-size:.68rem;font-weight:700;}
.pill-ok{background:var(--greensoft);color:var(--green);}
.pill-low{background:var(--yellowsoft);color:var(--yellow);}
.pill-so{background:var(--redsoft);color:var(--red);}
.pill-late{background:var(--redsoft);color:var(--red);}
.pill-ot{background:var(--greensoft);color:var(--green);}
.pill-valid{background:var(--yellowsoft);color:var(--yellow);}
.pill-cafe{background:var(--bluesoft);color:var(--blue2);}
.pill-pers{background:var(--surf2);color:var(--ink2);}

/* MODAL */
.ov{position:fixed;inset:0;background:rgba(22,27,38,.46);display:flex;align-items:center;justify-content:center;z-index:200;padding:14px;}
.modal{background:var(--surf);border-radius:18px;box-shadow:var(--shlg);width:100%;max-width:480px;max-height:90vh;overflow-y:auto;}
.mh{display:flex;align-items:center;justify-content:space-between;padding:15px 18px;border-bottom:1px solid var(--border);position:sticky;top:0;background:var(--surf);z-index:1;}
.mh h2{font-size:.96rem;font-weight:800;}
.mb{padding:18px;display:flex;flex-direction:column;gap:11px;}
.mf{padding:13px 18px;border-top:1px solid var(--border);display:flex;justify-content:flex-end;gap:8px;position:sticky;bottom:0;background:var(--surf);}
.field{display:flex;flex-direction:column;gap:5px;}
.field label{font-size:.7rem;font-weight:700;color:var(--ink2);text-transform:uppercase;letter-spacing:.03em;}
.field input,.field select,.field textarea{padding:8px 11px;border:1.5px solid var(--border);border-radius:9px;font-size:.86rem;background:var(--bg);color:var(--ink);}
.field input:focus,.field select:focus,.field textarea:focus{outline:none;border-color:var(--blue);}
.frow{display:grid;grid-template-columns:1fr 1fr;gap:9px;}
.cprev{background:var(--surf2);border-radius:9px;padding:8px 12px;font-size:.8rem;display:flex;justify-content:space-between;font-weight:600;}

/* NUMPAD */
.np-ov{position:fixed;inset:0;background:rgba(22,27,38,.52);display:flex;align-items:flex-end;justify-content:center;z-index:300;}
.np-sheet{background:var(--surf);border-radius:20px 20px 0 0;padding:14px;width:100%;max-width:360px;}
.np-disp{font-size:1.9rem;font-weight:800;text-align:right;padding:8px 12px;background:var(--surf2);border-radius:11px;margin-bottom:10px;min-height:52px;}
.np-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;}
.np-key{padding:15px;border-radius:11px;font-size:1.05rem;font-weight:700;background:var(--surf2);text-align:center;transition:transform .1s,background .1s;}
.np-key:active{transform:scale(.94);background:var(--border);}
.np-key.kblue{background:var(--blue);color:#fff;}
.np-key.kred{background:var(--redsoft);color:var(--red);}

/* POS */
.pos-wrap{display:flex;height:calc(100vh - 54px);overflow:hidden;}
.pos-left{flex:1;display:flex;flex-direction:column;overflow:hidden;}
.pos-right{width:335px;flex-shrink:0;background:var(--surf);border-left:1px solid var(--border);display:flex;flex-direction:column;overflow:hidden;}
.pos-lhead{padding:10px 12px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:9px;flex-shrink:0;}
.cat-list{padding:12px;display:flex;flex-direction:column;gap:8px;overflow-y:auto;flex:1;}
.cat-card{display:flex;align-items:center;gap:11px;padding:13px 15px;border-radius:13px;border:1.5px solid var(--border);background:var(--surf);cursor:pointer;transition:all .15s;text-align:left;width:100%;}
.cat-card:hover{border-color:var(--blue);background:var(--bluesoft);}
.cat-icon{width:38px;height:38px;border-radius:11px;background:var(--surf2);display:flex;align-items:center;justify-content:center;font-size:1.15rem;flex-shrink:0;}
.cat-name{font-weight:700;font-size:.9rem;}
.cat-count{font-size:.72rem;color:var(--ink2);}
.prod-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px;padding:12px;overflow-y:auto;align-content:start;flex:1;}
.pc{background:var(--surf);border:1.5px solid var(--border);border-radius:13px;padding:11px;cursor:pointer;transition:all .15s;position:relative;height:120px;display:flex;flex-direction:column;justify-content:flex-end;}
.pc:hover{border-color:var(--blue);}
.pc:active{transform:scale(.97);}
.pc.em{border-style:dashed;}
.sdot{position:absolute;top:9px;right:9px;width:10px;height:10px;border-radius:50%;box-shadow:0 0 0 2px var(--surf);}
.sdot-ok{background:var(--green);}
.sdot-low{background:var(--yellow);}
.sdot-so{background:var(--red);}
.pc-name{font-weight:700;font-size:.83rem;padding-right:14px;margin-bottom:3px;}
.pc-price{color:var(--blue2);font-size:.8rem;font-weight:700;}
.pc-sizes{font-size:.67rem;color:var(--ink3);margin-top:2px;}
.pc-ghost{border:1.5px dashed var(--border);border-radius:13px;display:flex;align-items:center;justify-content:center;gap:5px;color:var(--ink3);font-weight:700;font-size:.76rem;min-height:76px;cursor:pointer;}
.edit-tog{display:flex;align-items:center;gap:5px;padding:5px 11px;border-radius:999px;border:1.5px solid var(--border);font-size:.73rem;font-weight:700;color:var(--ink2);background:var(--surf);margin-left:auto;}
.edit-tog.on{background:var(--blue);border-color:var(--blue);color:#fff;}

/* CART */
.ch{padding:11px 13px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;flex-shrink:0;}
.ch h3{font-weight:800;font-size:.92rem;}
.ot-row{display:flex;gap:5px;padding:8px 13px;border-bottom:1px solid var(--border);flex-shrink:0;}
.ot-btn{flex:1;padding:7px;border-radius:8px;border:1.5px solid var(--border);font-size:.7rem;font-weight:700;text-align:center;}
.ot-btn.act{background:var(--ink);color:#fff;border-color:var(--ink);}
.cart-items{flex:1;overflow-y:auto;padding:7px 9px;}
.cib{background:var(--bg);border-radius:11px;padding:9px 11px;margin-bottom:7px;}
.cim{display:flex;align-items:center;gap:7px;}
.ci-name{flex:1;font-weight:700;font-size:.82rem;}
.ci-price{font-size:.75rem;color:var(--ink2);}
.qc{display:flex;align-items:center;gap:5px;}
.qc button{width:22px;height:22px;border-radius:6px;background:var(--surf);border:1px solid var(--border);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:.78rem;}
.ao-row{display:flex;flex-wrap:wrap;gap:4px;margin-top:5px;}
.ao-chip{display:flex;align-items:center;gap:3px;padding:2px 7px;border-radius:999px;background:var(--bluesoft);color:var(--blue2);font-size:.67rem;font-weight:700;}
.ao-add{padding:2px 8px;border-radius:999px;border:1.5px dashed var(--border);font-size:.67rem;font-weight:700;color:var(--ink3);}
.note-inp{width:100%;margin-top:5px;padding:4px 8px;border:1px solid var(--border);border-radius:7px;font-size:.72rem;background:transparent;color:var(--ink);resize:none;}
.note-inp::placeholder{color:var(--ink3);}
.cart-bot{flex-shrink:0;border-top:1px solid var(--border);}
.sect{padding:7px 13px;}
.slabel{font-size:.67rem;font-weight:700;color:var(--ink2);text-transform:uppercase;letter-spacing:.04em;margin-bottom:5px;}
.disc-row{display:flex;gap:5px;}
.db{flex:1;padding:6px;border-radius:8px;border:1.5px solid var(--border);font-size:.7rem;font-weight:700;color:var(--ink2);}
.db.act{background:var(--bluesoft);border-color:var(--blue);color:var(--blue2);}
.pay-row{display:flex;gap:5px;margin-bottom:7px;}
.pb{flex:1;padding:7px;border-radius:8px;border:1.5px solid var(--border);font-size:.72rem;font-weight:700;}
.pb.act{background:var(--ink);color:#fff;border-color:var(--ink);}
.tender-row{display:flex;gap:5px;margin-bottom:5px;}
.tb2{flex:1;padding:7px 3px;border-radius:8px;border:1.5px solid var(--border);font-size:.7rem;font-weight:700;text-align:center;}
.tb2.exact{background:var(--green);color:#fff;border-color:var(--green);}
.tb2.amt{background:var(--bluesoft);border-color:var(--blue);color:var(--blue2);}
.sumbox{padding:7px 13px;border-top:1px solid var(--border);}
.sr{display:flex;justify-content:space-between;font-size:.8rem;margin-bottom:2px;}
.sr.tot{font-weight:800;font-size:.98rem;border-top:1px solid var(--border);padding-top:5px;margin-top:3px;}

/* ORDERS */
.ord-list{display:flex;flex-direction:column;gap:11px;}
.oc{padding:13px;display:flex;flex-direction:column;gap:9px;}
.och{display:flex;align-items:center;gap:9px;}
.tbadge{width:36px;height:36px;border-radius:11px;background:var(--bluesoft);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:.88rem;color:var(--blue2);}
.drow{display:flex;align-items:flex-start;gap:8px;padding:5px 0;border-bottom:1px solid var(--border);}
.drow:last-child{border-bottom:none;}
.dchk{width:17px;height:17px;border-radius:5px;border:2px solid var(--border);flex-shrink:0;margin-top:2px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .1s;}
.dchk.on{background:var(--green);border-color:var(--green);}
.dname{font-weight:700;font-size:.82rem;}
.dmeta{font-size:.7rem;color:var(--ink2);margin-top:2px;}

/* STATS */
.stat-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(135px,1fr));gap:11px;margin-bottom:14px;}
.sc{padding:13px;}
.sc .lbl{font-size:.66rem;color:var(--ink2);font-weight:700;text-transform:uppercase;letter-spacing:.04em;}
.sc .val{font-size:1.35rem;font-weight:800;margin-top:3px;}
.dfbar{display:flex;align-items:center;gap:7px;flex-wrap:wrap;margin-bottom:12px;}
.dp{padding:5px 11px;border-radius:8px;border:1.5px solid var(--border);font-size:.74rem;font-weight:700;color:var(--ink2);background:var(--surf);}
.dp.act{background:var(--ink);color:#fff;border-color:var(--ink);}
.rtabs{display:flex;gap:7px;margin-bottom:12px;flex-wrap:wrap;}
.tflag{background:var(--bluesoft);color:var(--blue2);padding:2px 7px;border-radius:5px;font-size:.64rem;font-weight:800;margin-left:5px;}

/* SHIFTS */
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:3px;margin-bottom:14px;}
.cal-day{aspect-ratio:1;border-radius:7px;display:flex;align-items:center;justify-content:center;font-size:.68rem;font-weight:600;background:var(--surf2);color:var(--ink3);}
.cal-day.worked{background:var(--bluesoft);color:var(--blue2);}
.cal-day.today-d{border:2px solid var(--blue);}

/* LOCK */
.lockgate{display:flex;flex-direction:column;align-items:center;justify-content:center;height:100%;gap:12px;text-align:center;padding:40px;}
.lockgate h2{font-size:1.2rem;font-weight:800;}
.lockgate p{color:var(--ink2);font-size:.84rem;max-width:300px;}

/* RECEIPT */
.rcv{font-size:.78rem;background:var(--surf);padding:16px;border-radius:11px;border:1px dashed var(--border);line-height:1.75;}
.rcc{text-align:center;}
.rcl{border-top:1px dashed var(--ink3);margin:6px 0;}
.rcr{display:flex;justify-content:space-between;}
.chit{font-size:.8rem;background:var(--surf);padding:13px;border-radius:11px;border:1px dashed var(--border);width:200px;line-height:1.7;}
.chit-num{font-size:2rem;font-weight:900;color:var(--blue);}
.chit-type{font-size:.7rem;font-weight:700;background:var(--bluesoft);color:var(--blue2);padding:2px 9px;border-radius:999px;display:inline-block;margin-bottom:5px;}

#print-area{display:none;}
@media print{
  @page{margin:0;}
  body *{visibility:hidden;}
  #print-area,#print-area *{visibility:visible;}
  #print-area{display:block;position:absolute;top:0;left:0;}
  #print-area.chit-size{width:40mm;font-size:8pt;line-height:1.4;}
  #print-area.receipt-size{width:80mm;font-size:9pt;line-height:1.6;}
  #print-area pre{white-space:pre-wrap;word-break:break-word;margin:0;padding:0;font-family:monospace;}
}
.toast{position:fixed;bottom:18px;right:18px;background:var(--ink);color:#fff;padding:10px 16px;border-radius:10px;font-size:.8rem;font-weight:600;box-shadow:var(--shlg);z-index:400;animation:ti .2s ease-out;max-width:280px;}
@keyframes ti{from{opacity:0;transform:translateY(5px);}to{opacity:1;transform:translateY(0);}}
.empty{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:44px 18px;color:var(--ink3);text-align:center;gap:7px;}
.empty h3{color:var(--ink2);font-weight:700;font-size:.95rem;}
</style>
</head>
<body>
<div id="app"><div style="display:flex;align-items:center;justify-content:center;height:100vh;color:var(--ink2);font-weight:700;">Loading Cafe Yoto…</div></div>
<div id="print-area"></div>
<script>
const BK='https://cafe-yoto-backend.onrender.com';
window.storage={
  async get(k){const r=await fetch(`${BK}/api/state/${encodeURIComponent(k)}`);if(r.status===404)return null;if(!r.ok)throw new Error();return r.json();},
  async set(k,v){const r=await fetch(`${BK}/api/state/${encodeURIComponent(k)}`,{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify({value:v})});if(!r.ok)throw new Error();return r.json();}
};

// ICONS
const IC={
  clk:'<svg width="17" height="17" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 3"/></svg>',
  pos:'<svg width="17" height="17" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24"><path d="M4 8l1.5-3h13L20 8"/><path d="M4 8h16v10a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2z"/><path d="M9 12h6"/></svg>',
  ord:'<svg width="17" height="17" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24"><rect x="5" y="3" width="14" height="18" rx="2"/><path d="M9 8h6M9 12h6M9 16h3"/></svg>',
  inv:'<svg width="17" height="17" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24"><path d="M21 8l-9-5-9 5 9 5 9-5z"/><path d="M3 8v8l9 5 9-5V8"/><path d="M12 13v8"/></svg>',
  rep:'<svg width="17" height="17" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24"><path d="M3 3v18h18"/><path d="M7 15l4-5 3 3 5-7"/></svg>',
  exp:'<svg width="17" height="17" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24"><path d="M21 12V7a2 2 0 0 0-2-2H5a2 2 0 0 0-2 2v10a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-1"/><path d="M21 12h-4a2 2 0 0 0 0 4h4v-4z"/></svg>',
  shf:'<svg width="17" height="17" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="17" rx="2"/><path d="M3 9h18M8 3v3M16 3v3"/></svg>',
  adm:'<svg width="17" height="17" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24"><rect x="4" y="11" width="16" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg>',
  pls:'<svg width="12" height="12" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>',
  mns:'<svg width="12" height="12" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" viewBox="0 0 24 24"><path d="M5 12h14"/></svg>',

function pStatus(p){
  if(!p.recipe||!p.recipe.length)return'ok';
  for(const r of p.recipe){const i=ingBy(r.ingredientId);if(!i)continue;if(isSO(i)||i.stockInBase<r.qty)return'so';}
  for(const r of p.recipe){const i=ingBy(r.ingredientId);if(!i)continue;if(isLow(i))return'low';}
  return'ok';
}

async function hashStr(s){
  const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(s));
  return Array.from(new Uint8Array(b)).map(x=>x.toString(16).padStart(2,'0')).join('');
}

// PAYROLL
function calcPay(emp,shift){
  if(!shift.timeOut)return 0;
  const ms=new Date(shift.timeOut)-new Date(shift.timeIn);
  const totalMins=Math.floor(ms/60000);
  const fullHrs=Math.floor(totalMins/60);
  const remMins=totalMins%60;
  const wt=(shift.workType||'barista').toLowerCase();
  const isBarista=wt==='barista';
  const hrRate=isBarista?(S.settings.baristaRate||64):(S.settings.catRate||57);
  const fiveMinBlocks=Math.floor(remMins/5);
  const extraPay=fiveMinBlocks*5;
  let pay=fullHrs*hrRate+extraPay;
  const st=shiftStatus(shift);
  if(st==='late')pay-=(S.settings.latePenalty||30);
  pay+=shift.tips||0;
  return Math.max(0,pay);
}

function shiftStatus(shift){
  if(shift.lateExcused)return'valid';
  const tin=new Date(shift.timeIn);
  const dow=tin.getDay(); // 0=Sun,1=Mon,...,6=Sat
  if(dow===0)return'ontime'; // Sunday off, no penalty
  if(dow===6)return'ontime'; // Saturday optional, no penalty
  const dayMap={1:'mon',2:'tue',3:'wed',4:'thu',5:'fri'};
  const dayKey=dayMap[dow];
  const emp=S.employees.find(e=>e.id===shift.employeeId);
  // Owner never gets late penalty
  if(emp&&(emp.role||'').toLowerCase()==='owner')return'ontime';
  // Get expected start from employee's schedule
  let expectedStart='10:00';
  if(emp&&emp.schedule&&emp.schedule[dayKey]&&emp.schedule[dayKey].start){
    expectedStart=emp.schedule[dayKey].start;
  } else if(S.settings.shiftDefs&&S.settings.shiftDefs[0]){
    expectedStart=S.settings.shiftDefs[0].start;
  }
  const[eh,em]=expectedStart.split(':').map(Number);
  const hm=tin.getHours()*60+tin.getMinutes();
  return hm>(eh*60+em)?'late':'ontime';
}

async function loadData(){
  try{
    const c=await window.storage.get('yoto-core');
    if(c&&c.value){
      const d=JSON.parse(c.value);
      S.employees=d.employees&&d.employees.length?d.employees:defEmployees();
      S.shifts=d.shifts||[];
      S.products=(d.products&&d.products.length?d.products:defProds()).map(migrateP);
      S.ingredients=d.ingredients&&d.ingredients.length?d.ingredients:defIngs();
      S.expenses=d.expenses||[];
      S.settings={...S.settings,...d.settings};
      S.categories=d.categories||S.categories;
      if(!S.settings.shiftDefs)S.settings.shiftDefs=[{id:'s1',name:'Morning',start:'10:00',end:'14:00'},{id:'s2',name:'Afternoon',start:'14:00',end:'18:00'}];
    }else{S.products=defProds();S.ingredients=defIngs();S.employees=defEmployees();await saveCore();}
  }catch(e){S.products=defProds();S.ingredients=defIngs();U.backendDown=true;}
  try{const o=await window.storage.get('yoto-orders');if(o&&o.value)S.orders=JSON.parse(o.value).orders||[];}catch(e){U.backendDown=true;}
  if(!U.posCategory&&S.categories.length)U.posCategory=S.categories[0];
  if(!S.settings.adminHash)hashStr('Aekei14!').then(h=>{S.settings.adminHash=h;saveCore();});
}

async function timeIn(){
  if(!U.activeEmpId||!U.clockWorkType)return;
  const ua=navigator.userAgent;
  const deviceType=/iPhone|iPad/.test(ua)?'iPhone/iPad':/Android/.test(ua)?'Android':'Desktop';
  const browser=ua.match(/(Chrome|Firefox|Safari|Edge)\/[\d.]+/)?.[0]||'Browser';
  const device=`${deviceType} · ${browser}`;
  // Save immediately with pending location — don't wait for GPS
  const newShift={id:uid(),employeeId:U.activeEmpId,workType:U.clockWorkType,timeIn:new Date().toISOString(),timeOut:null,lateExcused:false,tips:0,location:'Getting location…',device};
  S.shifts.push(newShift);
  U.viewOnly=false;U.clockWorkType='';
  await saveCore();
  ra();toast('Timed in!');
  // Get location in background and update
  try{
    const pos=await new Promise((res,rej)=>navigator.geolocation.getCurrentPosition(res,rej,{timeout:8000,enableHighAccuracy:true}));
    const{latitude:lat,longitude:lng}=pos.coords;
    let loc=`${lat.toFixed(5)}, ${lng.toFixed(5)}`;
    try{
      const r=await fetch(`https://nominatim.openstreetmap.org/reverse?lat=${lat}&lon=${lng}&format=json`);
      const d=await r.json();
      loc=d.display_name||loc;
    }catch{}
    newShift.location=loc;
    await saveCore();
    ra();
  }catch(err){
    newShift.location=err.code===1?'Location denied':'Location unavailable';
    await saveCore();
    ra();
  }
}
async function timeOut(){
  const s=actShift(U.activeEmpId);if(!s)return;
  if(s._saving)return; s._saving=true;
  s.timeOut=new Date().toISOString();
  await saveCore();
  s._saving=false;
  ra();toast(`Shift ended — ${fdur(new Date(s.timeOut)-new Date(s.timeIn))} worked.`);
}
async function signOut(){await timeOut();U.activeEmpId=null;setView('clock');}

function calcTotals(){
  const sub=U.cart.reduce((s,c)=>s+(c.price+(c.addons||[]).reduce((a,x)=>a+x.price,0))*c.qty,0);
  if(U.discType!=='none'){const ve=sub/1.12,disc=ve*0.2;return{sub,disc,vat:0,total:ve-disc};}
  return{sub,disc:0,vat:sub-sub/1.12,total:sub};
}
function addToCart(productId){
  if(!canM())return;
  const p=S.products.find(x=>x.id===productId);if(!p||!pAvail(p))return;
  if(p.sizes.length>1){openModal('pickSize',productId);return;}
  U.cart.push({id:uid(),productId:p.id,sizeId:p.sizes[0].id,name:p.name,price:p.sizes[0].price,qty:1,addons:[],note:''});
  ra();
}
function changeQty(idx,d){U.cart[idx].qty+=d;if(U.cart[idx].qty<=0)U.cart.splice(idx,1);ra();}
function clearCart(){U.cart=[];U.discType='none';U.discName='';U.discId='';U.tendered=0;U.payRef='';ra();}

function completeSale(){
  if(!canM()||!U.cart.length)return;
  const t=calcTotals();
  if(U.discType!=='none'&&(!U.discName.trim()||!U.discId.trim())){toast('Enter ID holder name and number.');return;}
  if(U.payMethod==='Cash'&&U.tendered>0&&U.tendered<t.total){toast('Amount tendered less than total.');return;}
  const empName=curEmp()?curEmp().name:'Staff';
  if(!canSave()){
    // View Only mode — show change screen but don't record anything
    const savedTendered=U.tendered;
    clearCart();
    if(U.payMethod==='Cash'&&savedTendered>0){
      const ch=Math.max(0,savedTendered-t.total);
      openModal('changeScreen',{change:ch,total:t.total,tendered:savedTendered,oid:null});
    }
    toast('View Only — not recorded.');
    return;
  }
  U.cart.forEach(ci=>{
    const p=S.products.find(x=>x.id===ci.productId);
    if(p&&p.recipe)p.recipe.forEach(r=>{const i=ingBy(r.ingredientId);if(i)i.stockInBase=Math.max(0,i.stockInBase-r.qty*ci.qty);});
    (ci.addons||[]).forEach(a=>{const ap=S.products.find(x=>x.id===a.productId);if(ap&&ap.recipe)ap.recipe.forEach(r=>{const i=ingBy(r.ingredientId);if(i)i.stockInBase=Math.max(0,i.stockInBase-r.qty*ci.qty);});});
  });
  const order={
    id:uid(),number:nextNum(),orderType:U.orderType,
    items:U.cart.map(c=>({...c,category:S.products.find(x=>x.id===c.productId)?.category||'',costEach:pcost(S.products.find(x=>x.id===c.productId)||{}),checked:false})),
    employeeId:U.activeEmpId,employeeName:empName,
    discountType:U.discType,discName:U.discName,discId:U.discId,
    paymentMethod:U.payMethod,payRef:U.payRef,
    tendered:U.payMethod==='Cash'?U.tendered:null,
    sub:t.sub,discount:t.disc,vat:t.vat,total:t.total,
    status:'preparing',timestamp:new Date().toISOString(),isRefunded:false
  };
  S.orders.push(order);saveCore();saveOrders();
  const oid=order.id;
  const savedTendered=order.tendered;
  clearCart();ra();
  toast(`#${order.number} sent to queue`);
  if(order.paymentMethod==='Cash'&&savedTendered){
    const change=Math.max(0,savedTendered-order.total);
    openModal('changeScreen',{change,total:order.total,tendered:savedTendered,oid:order.id});
  } else {
    openModal('receipt',oid);
  }
}

function addAddonToOrder(orderId,prodId){
  const o=S.orders.find(x=>x.id===orderId);
  const p=S.products.find(x=>x.id===prodId);
  if(!o||!p)return;
  if(!o.extraCharges)o.extraCharges=[];
  const price=p.sizes[0]?.price||0;
  o.extraCharges.push({name:p.name,price});
  o.total=(o.total||0)+price;
  o.sub=(o.sub||0)+price;
  saveOrders();ra();toast('Added '+p.name+' to order #'+o.number);
}
function addCustomAddonToOrder(orderId){
  const name=document.getElementById('ord-ao-name')?.value.trim();
  const amt=parseFloat(document.getElementById('ord-ao-amt')?.value)||0;
  if(!name||amt<=0){toast('Enter description and amount.');return;}
  const o=S.orders.find(x=>x.id===orderId);if(!o)return;
  if(!o.extraCharges)o.extraCharges=[];
  o.extraCharges.push({name,price:amt});
  o.total=(o.total||0)+amt;
  o.sub=(o.sub||0)+amt;
  saveOrders();ra();toast('Added '+name+' '+peso(amt));
}
function toggleCheck(oid,idx){const o=S.orders.find(x=>x.id===oid);if(!o)return;o.items[idx].checked=!o.items[idx].checked;saveOrders();ra();}
function advOrder(id,status){if(!canM())return;const o=S.orders.find(x=>x.id===id);if(!o)return;o.status=status;saveOrders();ra();}
function refundOrder(id){
  if(!canM())return;
  const o=S.orders.find(x=>x.id===id);if(!o)return;
  if(!confirm(`Refund order #${o.number} for ${peso(o.total)}?`))return;
  o.isRefunded=true;o.status='cancelled';
  o.items.forEach(ci=>{const p=S.products.find(x=>x.id===ci.productId);if(p&&p.recipe)p.recipe.forEach(r=>{const i=ingBy(r.ingredientId);if(i)i.stockInBase+=r.qty*ci.qty;});});
  saveCore();saveOrders();ra();toast(`Order #${o.number} refunded.`);
}

function printItemReport(){
  const pa=document.getElementById('print-area');
  pa.className='receipt-size';pa.style.width='80mm';pa.style.fontSize='8pt';
  const rng=dRange(U.repPreset,U.repStart,U.repEnd);
  const ords=S.orders.filter(o=>{if(o.isRefunded)return false;const d=new Date(o.timestamp);return d>=rng.s&&d<=rng.e;});
  let text=sanitizePrint('CAFE YOTO - SALES REPORT')+'\n';
  text+='-'.repeat(40)+'\n';
  ords.forEach(o=>{
    o.items.forEach(i=>{
      text+=ftm(o.timestamp)+' #'+o.number+' '+sanitizePrint(i.name);
      text+=' P'+(i.price).toFixed(2);
      text+=' '+sanitizePrint(o.orderType)+' '+sanitizePrint(o.paymentMethod)+'\n';
      if(i.addons&&i.addons.length)text+='  +'+i.addons.map(a=>sanitizePrint(a.name)).join(', ')+'\n';
    });
  });
  text+='-'.repeat(40)+'\n';
  text+='Total items: '+ords.reduce((s,o)=>s+o.items.length,0)+'\n';
  text+='Total: P'+ords.reduce((s,o)=>s+o.total,0).toFixed(2)+'\n';
  pa.innerHTML='<pre>'+text+'</pre>';
  window.print();
}
function setRepPreset(k){U.repPreset=k;if(k==='custom'&&!U.repStart){const t=today();U.repStart=t;U.repEnd=t;}ra();}
function exportXls(){
  const rng=dRange(U.repPreset,U.repStart,U.repEnd);
  const ords=S.orders.filter(o=>{if(o.isRefunded)return false;const d=new Date(o.timestamp);return d>=rng.s&&d<=rng.e;});
  const refundedOrds=S.orders.filter(o=>{if(!o.isRefunded)return false;const d=new Date(o.timestamp);return d>=rng.s&&d<=rng.e;});
  const net=ords.reduce((s,o)=>s+o.total,0);
  const gross=ords.reduce((s,o)=>s+(o.sub||o.subtotal||o.total||0),0);
  const discs=ords.reduce((s,o)=>s+(o.discount||0),0);
  const cogs=ords.reduce((s,o)=>s+o.items.reduce((ss,i)=>ss+(i.costEach||0)*i.qty,0),0);
  const refundAmt=refundedOrds.reduce((s,o)=>s+o.total,0);
  const cafeExp=S.expenses.filter(e=>{const d=new Date(e.timestamp);return d>=rng.s&&d<=rng.e&&e.type==='Cafe';}).reduce((s,e)=>s+e.amount,0);
  const itemMap={};ords.forEach(o=>o.items.forEach(i=>{itemMap[i.name]=itemMap[i.name]||{qty:0,rev:0};itemMap[i.name].qty+=i.qty;itemMap[i.name].rev+=i.qty*i.price;}));
  const wb=XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb,XLSX.utils.aoa_to_sheet([
    ['Cafe Yoto Sales Summary'],[],
    ['Gross Sales',gross],['Discounts',discs],['Refunds',refundAmt],
    ['Net Sales',net],['Cost of Goods',cogs],['Gross Profit',net-cogs],
    ['Cafe Expenses',cafeExp],['Money Left',net-cogs-discs-refundAmt-cafeExp],
    ['Orders',ords.length],['Refunded Orders',refundedOrds.length]
  ]),'Summary');
  XLSX.utils.book_append_sheet(wb,XLSX.utils.aoa_to_sheet([['Item','Qty','Revenue'],...Object.entries(itemMap).map(([n,d])=>[n,d.qty,d.rev])]),'By Item');
  XLSX.writeFile(wb,`CafeYoto-${today()}.xlsx`);
}

function exportShiftsXls(dateFilter){
  const shifts=dateFilter?S.shifts.filter(s=>s.timeIn.slice(0,10)===dateFilter):S.shifts;
  const rows=[['Name','Work Type','Date','Time In','Time Out','Hours','Status','Pay (₱)','Tips (₱)','Salary Status','Location','Device']];
  shifts.sort((a,b)=>new Date(a.timeIn)-new Date(b.timeIn)).forEach(s=>{
    const emp=S.employees.find(e=>e.id===s.employeeId)||{};
    const st=shiftStatus(s);
    const dur=s.timeOut?Math.floor((new Date(s.timeOut)-new Date(s.timeIn))/60000):0;
    const h=Math.floor(dur/60);const m=dur%60;
    const hrsStr=m>0?h+'hr '+m+'min':h+'hr';
    const pay=s.timeOut?calcPay(emp,s):0;
    rows.push([
      emp.name||'—',s.workType||'—',fdt(s.timeIn),ftm(s.timeIn),
      s.timeOut?ftm(s.timeOut):'ongoing',hrsStr,
      st==='late'?'Late':st==='valid'?'Valid':'Present',
      pay,s.tips||0,emp.salaryPaid?'Paid':'Unpaid',
      s.location||'—',s.device||'—'
    ]);
  });
  const wb=XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb,XLSX.utils.aoa_to_sheet(rows),'Shifts');
  XLSX.writeFile(wb,'CafeYoto-Shifts-'+(dateFilter||'all')+'.xlsx');
  toast('Shifts exported!');
}
function toggleSalaryPaid(empId){
  const e=S.employees.find(x=>x.id===empId);if(!e)return;
  e.salaryPaid=!e.salaryPaid;
  e.salaryPaidDate=e.salaryPaid?new Date().toISOString():null;
  saveCore();ra();
  toast(e.salaryPaid?e.name+' salary marked as Paid':'Marked as unpaid');
}
function exportSalaryXls(){
  const rng=dRange(U.salaryPreset||'all',U.salaryStart||'',U.salaryEnd||'');
  const staffEmps=S.employees.filter(e=>(e.role||'').toLowerCase()!=='owner');
  const rows=[['Name','Hours','Earned (₱)','Tips (₱)','Penalty (₱)','Total Earned (₱)','Status','Paid Date']];
  staffEmps.forEach(e=>{
    const empShifts=S.shifts.filter(s=>s.employeeId===e.id&&s.timeOut&&new Date(s.timeIn)>=rng.s&&new Date(s.timeIn)<=rng.e);
    const totalMinsAll=empShifts.reduce((sum,s)=>sum+Math.floor((new Date(s.timeOut)-new Date(s.timeIn))/60000),0);
    const dispH=Math.floor(totalMinsAll/60);const dispM=totalMinsAll%60;
    const hrsStr=dispM>0?dispH+'hr '+dispM+'min':dispH+'hr';
    const earnedBase=empShifts.reduce((sum,s)=>{
      const ms=new Date(s.timeOut)-new Date(s.timeIn);
      const totalM=Math.floor(ms/60000);
      const fullH=Math.floor(totalM/60);const remM=totalM%60;
      const wt=(s.workType||'barista').toLowerCase();
      const hr=wt==='barista'?(S.settings.baristaRate||64):(S.settings.catRate||57);
      return sum+fullH*hr+Math.floor(remM/5)*5;
    },0);
    const totalPenalty=empShifts.filter(s=>shiftStatus(s)==='late').length*(S.settings.latePenalty||30);
    const tips=e.tips||0;
    const total=earnedBase-totalPenalty+tips;
    rows.push([e.name,hrsStr,earnedBase,tips,totalPenalty,total,e.salaryPaid?'Paid':'Unpaid',e.salaryPaidDate?fdt(e.salaryPaidDate):'']);
  });
  const wb=XLSX.utils.book_new();
  const ws=XLSX.utils.aoa_to_sheet(rows);
  XLSX.utils.book_append_sheet(wb,ws,'Salary Summary');
  const period=U.salaryPreset==='custom'?(U.salaryStart+' to '+U.salaryEnd):U.salaryPreset||'all';
  XLSX.writeFile(wb,'CafeYoto-Salary-'+period+'-'+today()+'.xlsx');
  toast('Salary report exported!');
}
function fixEmployees(){
  if(!U.isAdmin)return;
  const defaults=defEmployees();
  // Update existing employees with correct schedules and roles
  S.employees.forEach(e=>{
    const match=defaults.find(d=>d.name.toLowerCase()===e.name.toLowerCase());
    if(match){
      e.role=match.role;
      if(!e.schedule||Object.keys(e.schedule).length===0)e.schedule=match.schedule;
    }
    if(e.name.toLowerCase()==='owner'||e.name.toLowerCase()==='keisha'){
      e.role='owner';e.name='Keisha';e.schedule={};
    }
  });
  // Add missing default employees
  defaults.forEach(def=>{
    const exists=S.employees.find(e=>e.name.toLowerCase()===def.name.toLowerCase());
    if(!exists)S.employees.push({...def,id:uid()});
  });
  saveCore();ra();toast('Employees updated with latest schedules!');
}

// DATE RANGE
function dRange(preset,start,end){
  const now=new Date();const s0=new Date(now.getFullYear(),now.getMonth(),now.getDate(),0,0,0);const e0=new Date(now.getFullYear(),now.getMonth(),now.getDate(),23,59,59);
  if(preset==='today')return{s:s0,e:e0};
  if(preset==='week'){const s=new Date(s0);s.setDate(s.getDate()-6);return{s,e:e0};}
  if(preset==='month'){const s=new Date(s0);s.setDate(s.getDate()-29);return{s,e:e0};}
  if(preset==='all')return{s:new Date(2000,0,1),e:e0};
  if(preset==='custom'&&start&&end)return{s:new Date(start+'T00:00:00'),e:new Date(end+'T23:59:59')};
  return{s:s0,e:e0};
}

// PRINT
// Sanitize text for thermal printer (remove emojis/special chars that cause Chinese garbage)
function sanitizePrint(str){
  if(!str)return'';
  let out='';
  for(let i=0;i<str.length;i++){
    const c=str[i];const code=str.charCodeAt(i);
    if(code<128){out+=c;}
    else{
      if(c==='\u20b1')out+='P';
      else if(c==='\u2014'||c==='\u2013')out+='-';
      else if(c==='\u00d7')out+='x';
      else if(c==='\u00b7')out+='.';
      else if(c==='\u2026')out+='...';
    }
  }
  return out;
}
function pLine(label,val,width){
  width=width||32;
  const l=sanitizePrint(label);const v=sanitizePrint(val);
  const space=Math.max(1,width-l.length-v.length);
  return l+' '.repeat(space)+v;
}
function buildChit(o){
  const div='-'.repeat(32);
  return o.items.map(item=>{
    const hdr=sanitizePrint(S.settings.chitHeader||'CAFE YOTO');
    let t='';
    t+=hdr+'\n';
    t+='#'+o.number+'  '+sanitizePrint(o.orderType.toUpperCase())+'\n';
    t+=div+'\n';
    t+=sanitizePrint(item.name)+'\n';
    if(item.addons&&item.addons.length)t+='  +'+item.addons.map(a=>sanitizePrint(a.name)).join(', +')+'\n';
    if(item.note)t+='  Note: '+sanitizePrint(item.note)+'\n';
    t+=div+'\n';
    t+=fdt(o.timestamp)+' '+ftm(o.timestamp)+'\n';
    t+='WiFi: '+sanitizePrint(S.settings.wifiPw||'-')+'\n';
    t+='\n\n\n';
    return t;
  });
}
function buildRcpt(o){
  const div='-'.repeat(32);
  const pesoP=n=>'P'+(Math.round((n||0)*100)/100).toFixed(2);
  let t='';
  t+=sanitizePrint(S.settings.rcptHeader||'CAFE YOTO')+'\n';
  t+=div+'\n';
  t+='#'+o.number+'  '+sanitizePrint(o.orderType)+'  '+ftm(o.timestamp)+'\n';
  t+=sanitizePrint(o.employeeName)+'\n';
  t+=div+'\n';
  o.items.forEach(i=>{
    t+=pLine(sanitizePrint(i.name),pesoP(i.price));
    (i.addons||[]).forEach(a=>{t+='\n  +'+sanitizePrint(a.name)+' '+pesoP(a.price);});
    if(i.note)t+='\n  Note: '+sanitizePrint(i.note);
    t+='\n';
  });
  t+=div+'\n';
  t+=pLine('Subtotal:',pesoP(o.sub))+'\n';
  if(o.discount>0)t+=pLine('Discount:','-'+pesoP(o.discount))+'\n';
  t+=pLine('VAT:',pesoP(o.vat))+'\n';
  t+=pLine('TOTAL:',pesoP(o.total))+'\n';
  t+=div+'\n';
  t+=sanitizePrint(o.paymentMethod);
  if(o.paymentMethod==='Cash'&&o.tendered)t+='  Change: '+pesoP(Math.max(0,o.tendered-o.total));
  t+='\n';
  if(o.payRef)t+='Ref: '+sanitizePrint(o.payRef)+'\n';
  if(o.discName)t+='ID: '+sanitizePrint(o.discName)+' ('+sanitizePrint(o.discId)+')\n';
  t+=div+'\n';
  t+=sanitizePrint(S.settings.rcptFooter||'Thank you!')+'\n\n\n';
  return t;
}

// INIT
// CAMERA
let _camStream=null;
async function openCamera(purpose){
  openModal('camera',{purpose});
  await new Promise(r=>setTimeout(r,300));
  try{
    _camStream=await navigator.mediaDevices.getUserMedia({video:{facingMode:'environment'},audio:false});
    const vid=document.getElementById('cam-preview');
    if(vid){vid.srcObject=_camStream;}
  }catch(e){toast('Camera not available: '+e.message);}
}
function stopCamera(){if(_camStream){_camStream.getTracks().forEach(t=>t.stop());_camStream=null;}}
function capturePhoto(purpose){
  const vid=document.getElementById('cam-preview');
  const canvas=document.getElementById('cam-canvas');
  const img=document.getElementById('cam-img');
  if(!vid||!canvas)return;
  canvas.width=vid.videoWidth;canvas.height=vid.videoHeight;
  canvas.getContext('2d').drawImage(vid,0,0);
  const dataUrl=canvas.toDataURL('image/jpeg',0.9);
  if(img)img.src=dataUrl;
  document.getElementById('cam-preview').style.display='none';
  document.getElementById('cam-captured').style.display='block';
  document.getElementById('cam-capture-btn').style.display='none';
  document.getElementById('cam-retake').style.display='inline-flex';
  document.getElementById('cam-save-btn').style.display='inline-flex';
  canvas.dataset.dataUrl=dataUrl;
  canvas.dataset.purpose=purpose;
}
function retakePhoto(){
  document.getElementById('cam-preview').style.display='block';
  document.getElementById('cam-captured').style.display='none';
  document.getElementById('cam-capture-btn').style.display='inline-flex';
  document.getElementById('cam-retake').style.display='none';
  document.getElementById('cam-save-btn').style.display='none';
}
function savePhoto(purpose){
  const canvas=document.getElementById('cam-canvas');
  if(!canvas)return;
  const dataUrl=canvas.dataset.dataUrl;
  if(!dataUrl)return;
  const link=document.createElement('a');
  const now=new Date();
  const timeStr=now.toLocaleTimeString('en-PH',{hour:'2-digit',minute:'2-digit',hour12:true}).replace(/:/g,'-').replace(/ /g,'');
  const dateStr=(now.getMonth()+1)+'-'+now.getDate()+'-'+(now.getFullYear()+'').slice(2);
  // Build drink name from current cart
  const drinkName=U.cart.length?U.cart.map(c=>c.name.replace(/[^a-zA-Z0-9]/g,'')).join('_'):'order';
  const filename=`${drinkName}-${timeStr}-${dateStr}.jpg`;
  link.download=filename;
  link.href=dataUrl;
  link.click();
  if(purpose==='ref')U.payRef='[Ref photo: '+filename+']';
  if(purpose==='id')U.discPhoto=dataUrl;
  stopCamera();closeModal();
  toast('Photo saved: '+filename);ra();
}

// BLUETOOTH PRINTER
let _savedPrinterDevice=null;
async function connectPrinter(){
  if(!navigator.bluetooth){toast('Bluetooth not supported on this browser.');return;}
  try{
    const dev=await navigator.bluetooth.requestDevice({acceptAllDevices:true,optionalServices:['000018f0-0000-1000-8000-00805f9b34fb','49535343-fe7d-4ae5-8fa9-9fafd205e455']});
    _savedPrinterDevice=dev;
    S.settings.savedPrinterName=dev.name||'Bluetooth Printer';
    saveCore();ra();
    toast('Printer saved: '+S.settings.savedPrinterName);
  }catch(e){toast('Printer connection cancelled.');}
}
async function btPrint(type,oid){
  const o=S.orders.find(x=>x.id===oid);if(!o)return;
  const texts=type==='chit'?buildChit(o):[buildRcpt(o)];
  const text=texts.join('\f');
  const printViaBluetoothDevice=async(dev)=>{
    const srv=await dev.gatt.connect();
    for(const svc of['000018f0-0000-1000-8000-00805f9b34fb','49535343-fe7d-4ae5-8fa9-9fafd205e455']){
      try{const s=await srv.getPrimaryService(svc);const cs=await s.getCharacteristics();const w=cs.find(c=>c.properties.write||c.properties.writeWithoutResponse);if(w){const enc=new TextEncoder().encode(text);const chunk=512;for(let i=0;i<enc.length;i+=chunk){await w.writeValue(enc.slice(i,i+chunk));}toast('Sent to printer!');return true;}}catch(e){}
    }
    return false;
  };
  // Try saved printer first
  if(_savedPrinterDevice){
    try{const ok=await printViaBluetoothDevice(_savedPrinterDevice);if(ok)return;}catch(e){_savedPrinterDevice=null;}
  }
  const pa=document.getElementById('print-area');
  if(type==='chit'){
    const chitSize=S.settings.chitPaperSize||'40x30';
    const wMm=chitSize==='custom'?(S.settings.chitW||40):parseInt(chitSize.split('x')[0]);
    pa.style.width=wMm+'mm';
    pa.style.fontSize='7pt';
    pa.className='chit-size';
  } else {
    const rcptW=S.settings.rcptPaperSize||'80mm';
    pa.style.width=rcptW;
    pa.style.fontSize='9pt';
    pa.className='receipt-size';
  }
  pa.innerHTML=`<pre>${text}</pre>`;
  if(!navigator.bluetooth){window.print();return;}
  try{
    const dev=await navigator.bluetooth.requestDevice({acceptAllDevices:true,optionalServices:['000018f0-0000-1000-8000-00805f9b34fb','49535343-fe7d-4ae5-8fa9-9fafd205e455']});
    await printViaBluetoothDevice(dev);
  }catch(e){window.print();}
}
function printBoth(oid){btPrint('chit',oid);setTimeout(()=>btPrint('receipt',oid),2000);}

if('serviceWorker' in navigator){
  window.addEventListener('load',()=>{
    navigator.serviceWorker.register('/sw.js').then(reg=>{
      // Check for updates every 2 minutes
      setInterval(()=>reg.update(),120000);
      // Listen for new SW taking over — reload the page
      reg.addEventListener('updatefound',()=>{
        const newSW=reg.installing;
        newSW.addEventListener('statechange',()=>{
          if(newSW.state==='activated'){
            window.location.reload();
          }
        });
      });
    }).catch(e=>console.log('SW failed:',e));
    // Listen for message from SW telling us to reload
    navigator.serviceWorker.addEventListener('message',e=>{
      if(e.data&&e.data.type==='SW_UPDATED'){
        window.location.reload();
      }
    });
  });
}
